name: Save ChartGPT Note to OneDrive

on:
  repository_dispatch:
    types: [save_chartgpt_note]
  schedule:
    - cron: '0 6 * * *'   # 10 PM PST / 11 PM PDT — processes all pending inbox files
  workflow_dispatch: {}    # manual trigger from GitHub UI (for backfill / testing)

jobs:
  save-note:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y rclone
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Download inbox file(s)
        env:
          INBOX_FILE: ${{ github.event.client_payload.inbox_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python read_inbox.py --all
          else
            python read_inbox.py
          fi

      - name: Create PDFs
        run: cat /tmp/payload.json | python chartgpt_notes.py

      - name: Upload to OneDrive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          echo "$RCLONE_CONF" | base64 -d > /tmp/rclone.conf
          echo "--- uploads.txt ---"
          cat /tmp/uploads.txt
          echo "---"
          while IFS='|' read -r local_path onedrive_dir || [ -n "$local_path" ]; do
            [ -z "$local_path" ] && continue
            filename=$(basename "$local_path")
            dest="onedrive915:$onedrive_dir/$filename"
            echo "Uploading: $local_path → $dest"
            rclone -v --config /tmp/rclone.conf copyto "$local_path" "$dest"
            echo "Saved: $onedrive_dir/$filename"
          done < /tmp/uploads.txt

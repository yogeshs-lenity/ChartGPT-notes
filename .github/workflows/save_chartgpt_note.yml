name: Save ChartGPT Note to OneDrive

on:
  repository_dispatch:
    types: [save_chartgpt_note]

jobs:
  save-note:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y rclone
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Download inbox file and create PDFs
        env:
          INBOX_FILE: ${{ github.event.client_payload.inbox_file }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
import base64, json, os, urllib.request

token = os.environ["GH_TOKEN"]
path  = os.environ.get("INBOX_FILE", "")
if not path:
    raise SystemExit("No inbox_file in payload")

url = f"https://api.github.com/repos/yogeshs-lenity/ChartGPT-notes/contents/{path}"
req = urllib.request.Request(url, headers={
    "Authorization": f"Bearer {token}",
    "Accept": "application/vnd.github+json",
})
with urllib.request.urlopen(req) as r:
    data = json.loads(r.read())

# GitHub returns base64 with line breaks — strip them before decoding
content = base64.b64decode(data["content"].replace("\n", "")).decode("utf-8")
sha = data["sha"]

with open("/tmp/payload.json", "w") as f:
    f.write(content)

# Delete the inbox file now that we have the content
del_req = urllib.request.Request(
    url, method="DELETE",
    data=json.dumps({"message": f"Process: {path}", "sha": sha}).encode(),
    headers={
        "Authorization": f"Bearer {token}",
        "Content-Type": "application/json",
        "Accept": "application/vnd.github+json",
    },
)
with urllib.request.urlopen(del_req) as r:
    print(f"Deleted inbox file: {path}")
PYEOF
          cat /tmp/payload.json | python chartgpt_notes.py

      - name: Upload to OneDrive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          echo "$RCLONE_CONF" | base64 -d > /tmp/rclone.conf
          echo "--- uploads.txt ---"
          cat /tmp/uploads.txt
          echo "---"
          while IFS='|' read -r local_path onedrive_dir || [ -n "$local_path" ]; do
            [ -z "$local_path" ] && continue
            filename=$(basename "$local_path")
            echo "Uploading: $local_path → onedrive915:$onedrive_dir/"
            rclone -v --config /tmp/rclone.conf copy "$local_path" "onedrive915:$onedrive_dir/"
            echo "Saved: $onedrive_dir/$filename"
          done < /tmp/uploads.txt

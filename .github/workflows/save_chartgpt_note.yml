name: Save ChartGPT Note to OneDrive

on:
  repository_dispatch:
    types: [save_chartgpt_note]

jobs:
  save-note:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y rclone
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Create PDFs
        run: |
          echo '${{ toJson(github.event.client_payload) }}' | python create_pdf.py

      - name: Upload to OneDrive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          echo "$RCLONE_CONF" | base64 -d > /tmp/rclone.conf
          echo "--- uploads.txt ---"
          cat /tmp/uploads.txt
          echo "---"
          while IFS='|' read -r local_path onedrive_dir || [ -n "$local_path" ]; do
            [ -z "$local_path" ] && continue
            filename=$(basename "$local_path")
            echo "Uploading: $local_path → onedrive915:$onedrive_dir/"
            rclone -v --config /tmp/rclone.conf copy "$local_path" "onedrive915:$onedrive_dir/"
            echo "Saved: $onedrive_dir/$filename"
          done < /tmp/uploads.txt

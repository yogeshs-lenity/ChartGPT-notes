name: Save ChartGPT Note to OneDrive

on:
  repository_dispatch:
    types: [save_chartgpt_note]

jobs:
  save-note:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install python-docx
          sudo apt-get install -y rclone

      - name: Create Word document
        run: |
          echo '${{ toJson(github.event.client_payload) }}' | python create_docx.py

      - name: Upload to OneDrive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          echo "$RCLONE_CONF" | base64 -d > /tmp/rclone.conf
          TARGET_DIR=$(cat /tmp/onedrive_dir.txt)
          FILENAME=$(cat /tmp/docx_filename.txt)
          rclone --config /tmp/rclone.conf copy "/tmp/$FILENAME" "onedrive915:$TARGET_DIR/"
          echo "Saved to OneDrive: $TARGET_DIR/$FILENAME"
